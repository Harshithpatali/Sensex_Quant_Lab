name: Full Model Search

on:
  workflow_dispatch:
    inputs:
      splits:
        description: "TimeSeriesSplit folds"
        default: "5"
        required: false

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Full search
        env:
          N_JOBS: "2"
          PYTHONPATH: ${{ github.workspace }}/shared
        run: python services/training_service/main.py --mode full --splits ${{ github.event.inputs.splits || 5 }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/ data/ || true
          git diff --staged --quiet || (git commit -m "chore: full model search $(date -u +%Y-%m-%d)" && git push)
