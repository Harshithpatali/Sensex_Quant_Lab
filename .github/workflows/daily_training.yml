name: Daily Sensex Training

on:
  schedule:
    # 10:45 UTC = 16:15 IST, Mon–Fri
    - cron: "45 10 * * 1-5"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest data + train (daily profile)
        env:
          N_JOBS: "2"
          PYTHONPATH: ${{ github.workspace }}/shared
        run: |
          python scripts/update_data.py || true
          python services/training_service/main.py --mode daily --splits 3

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ artifacts/ || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: daily model update $(date -u +%Y-%m-%d)"
            git push
          fi
