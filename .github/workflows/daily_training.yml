name: Daily Sensex Training

on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-sensex-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        env:
          N_JOBS: "1"
          PYTHONPATH: ${{ github.workspace }}/shared
        run: |
          python scripts/update_data.py || true
          python services/training_service/main.py --mode daily --splits 3 --max-models 5

      - name: Upload trained artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifacts/
            data/
          retention-days: 3
          if-no-files-found: error

  commit:
    needs: train
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download trained artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: ./

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create training branch
        id: branch
        run: |
          BRANCH="daily-training-${GITHUB_RUN_ID}"
          git switch -c "${BRANCH}"
          echo "branch=${BRANCH}" >> "${GITHUB_OUTPUT}"

      - name: Commit artifacts
        id: commit
        run: |
          git add artifacts/ data/

          if git diff --cached --quiet; then
            echo "No artifact changes."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "chore: daily model update $(date -u +%Y-%m-%d)"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Push training branch
        if: steps.commit.outputs.changed == 'true'
        run: |
          git push origin "${{ steps.branch.outputs.branch }}"

      - name: Create Pull Request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "chore: daily model update $(date -u +%Y-%m-%d)" \
            --body "Automated daily Sensex model/data artifact update from GitHub Actions."
