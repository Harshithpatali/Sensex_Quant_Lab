name: Daily Sensex Training

on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:

# Prevent two daily-training workflows from trying to update main at once.
concurrency:
  group: daily-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download data + train
        env:
          N_JOBS: "1"
          PYTHONPATH: ${{ github.workspace }}/shared
        run: |
          python scripts/update_data.py || true
          python services/training_service/main.py \
            --mode daily \
            --splits 3 \
            --max-models 5

      - name: Upload trained artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifacts/
            data/
          retention-days: 3
          if-no-files-found: error

  commit:
    needs: train
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download trained artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: ./

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Commit and push artifacts
        shell: bash
        run: |
          set -euo pipefail

          git add artifacts/ data/

          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi

          git commit -m "chore: daily model update $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "main changed while pushing. Refreshing remote history..."

            git fetch origin main

            # Rebase our artifact commit onto the newest main.
            git rebase origin/main || {
              echo "Rebase conflict detected."
              git rebase --abort || true
              exit 1
            }

            sleep 5
          done

          echo "Unable to push after 5 attempts."
          exit 1
