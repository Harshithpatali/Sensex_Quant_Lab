name: Daily Sensex Training

on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download data + train
        env:
          N_JOBS: "1"
          PYTHONPATH: ${{ github.workspace }}/shared
        run: |
          python scripts/update_data.py || true
          python services/training_service/main.py --mode daily --splits 3 --max-models 5

      - name: Commit and push artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily model update"
          file_pattern: "artifacts/* data/*"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com