name: Daily Sensex Training

on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train
        env:
          N_JOBS: "1"
          PYTHONPATH: ${{ github.workspace }}/shared
        run: |
          python scripts/update_data.py || true
          python services/training_service/main.py --mode daily --splits 3 --max-models 5

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifacts/
            data/
          retention-days: 3
          if-no-files-found: error

  commit:
    needs: train
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Download trained files
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: ./

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily model update"
          file_pattern: "artifacts/* data/*"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
