name: Daily Sensex Training

on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download data + train
        env:
          N_JOBS: "1"
          PYTHONPATH: ${{ github.workspace }}/shared
        run: |
          python scripts/update_data.py || true
          python services/training_service/main.py --mode daily --splits 3 --max-models 5

      - name: Commit and push with retries
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add artifacts/ data/ || true

          if git diff --staged --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi

          git commit -m "chore: daily model update $(date -u +%Y-%m-%d)"

          # Retry: rebase onto latest main, then push
          for i in 1 2 3 4 5 6; do
            echo "Push attempt $i..."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push succeeded"
                exit 0
              fi
            else
              echo "Rebase conflict — abort and retry"
              git rebase --abort || true
              git reset --soft origin/main
              git add artifacts/ data/ || true
              git commit -m "chore: daily model update $(date -u +%Y-%m-%d)" || true
            fi
            sleep 10
          done

          echo "All push attempts failed"
          exit 1